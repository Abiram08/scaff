[package]
name = "scaff"
version = "1.0.0"
edition = "2021"
description = "Harness Research Agent — a verticalized deep-research CLI for the Harness platform."
authors = ["scaff contributors"]
license = "MIT"

[[bin]]
name = "scaff"
path = "src/main.rs"

[lib]
name = "scaff"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
console = "0.15"
dirs = "5"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
scraper = "0.20"
pulldown-cmark = "0.12"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
