[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scaff"
version = "0.2.0"
description = "Scaffold ready-to-run AI agent projects from plain English descriptions with advanced token management, analytics, and telemetry"
readme = "README.md"
license = { text = "MIT" }
keywords = ["ai", "agent", "cli", "scaffolding", "openai", "gpt", "token-management", "analytics"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "psutil>=5.9.0",
]

[[project.authors]]
name = "scaff contributors"

[[project.maintainers]]
name = "scaff contributors"

[project.urls]
Homepage = "https://github.com/your-repo/scaff"
Repository = "https://github.com/your-repo/scaff"
Documentation = "https://github.com/your-repo/scaff#readme"
"Bug Tracker" = "https://github.com/your-repo/scaff/issues"

[project.scripts]
scaff = "scaff.main:app"
scaff-json = "scaff.json_mode:main"

[tool.setuptools.package-data]
scaff = ["templates/*.j2"]
